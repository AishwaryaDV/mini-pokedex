<app-async-state
  [state]="state()"
  (retry)="retry.emit()"
  loadingLabel="Loading teams…"
  emptyMessage="No teams yet. Build your first team below."
>
  <div class="team-list">
    @for (team of state().data ?? []; track team.id; let i = $index) {
      <app-team-card
        [team]="team"
        [pokemonById]="pokemonById()"
        [index]="i"
        [active]="team.id === selectedId()"
        (selected)="selectTeam.emit($event)"
        (deleteRequested)="deleteTeam.emit($event)"
      />
    }
  </div>
</app-async-state>
