<span class="chip">
  @if (imageUrl()) {
    <img
      class="chip__image"
      [src]="imageUrl()"
      alt=""
      aria-hidden="true"
      width="24"
      height="24"
      loading="lazy"
    />
  }
  <span class="chip__label">{{ label() }}</span>
  @if (removable()) {
    <button
      type="button"
      class="chip__remove"
      (click)="remove.emit()"
      [attr.aria-label]="'Remove ' + label()"
    >
      ×
    </button>
  }
</span>
